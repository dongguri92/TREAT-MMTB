[project]
name = "task1-xraydar-twostage-inference"
version = "0.1.0"
description = "Offline TREAT-MMTB Task 1 two-stage inference environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib==1.5.3",
    "numpy==2.5.1",
    "pillow==12.3.0",
    "pydicom==3.0.2",
    "pylibjpeg==2.1.0",
    "pylibjpeg-libjpeg==2.4.0",
    "pylibjpeg-openjpeg==2.5.0",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "simpleitk==2.5.5",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "xgboost-cpu==3.3.0",
]

[tool.uv]
package = false
exclude-newer-package = { torch = false, torchvision = false }

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
